<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Övningsstudio</title>
<style>
  :root {
    --bg: #14161a; --panel: #1d2026; --line: #2c313a; --text: #eef0f3;
    --muted: #9aa3b0; --accent: #ff4d4d; --ok: #5fd08a; --warn: #f2c14e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 20px;
         grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: var(--muted); margin: 0 0 14px; }
  .stage { position: relative; aspect-ratio: 16/9; margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; }
  .stage video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  body.mobile .stage { aspect-ratio: 4/5; }
  .timer {
    position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); padding: 3px 9px; border-radius: 6px;
    background: rgba(0,0,0,.55); font: 600 14px/1.2 ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #countdown { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font: 700 120px/1 -apple-system, sans-serif; color: #fff; text-shadow: 0 2px 16px rgba(0,0,0,.7); }
  #caption { position: absolute; left: 10px; right: 10px; bottom: 38px; text-align: center; font-size: 15px; line-height: 1.3;
    color: #fff; text-shadow: 0 1px 3px #000, 0 0 8px #000; pointer-events: none; }
  #caption span { background: rgba(0,0,0,.45); padding: 2px 6px; border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .wide { grid-column: 1 / -1; }
  #clips { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  #clips li { display: flex; gap: 12px; align-items: flex-start; background: #23272e; border-radius: 8px; padding: 8px; }
  #clips img { width: 44px; height: 55px; object-fit: cover; border-radius: 6px; background: #000; flex: none; transform: scaleX(-1); }
  #clips .t { font-weight: 600; } #clips .m { color: var(--muted); font-size: 13px; }
  #clips details { font-size: 13px; color: var(--muted); margin-top: 4px; } #clips summary { cursor: pointer; }
  #clips button { padding: 4px 10px; font-size: 13px; margin-left: auto; flex: none; }
  .empty { color: var(--muted); font-size: 14px; }
  .timer.rec { color: var(--accent); }
  .timer.prep { color: var(--warn); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
         margin-right: 8px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.15); }
  .bar > div { height: 100%; width: 0; background: var(--accent); }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .recrow { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; min-width: 0; }
  .recrow #rec { padding: 6px 14px; font-size: 14px; flex: none; }
  .recrow .chk { font-size: 12px; flex: none; white-space: nowrap; }
  .recrow .status { margin: 0; min-height: 0; font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recrow .count { font-size: 12px; flex: none; margin-left: 0; white-space: nowrap; }
  #tag { position: absolute; right: 8px; bottom: 8px; max-width: 32%; padding: 3px 7px; border-radius: 5px; background: rgba(0,0,0,.55);
         font-size: 12px; font-weight: 700; line-height: 1.2; text-align: right; }
  button, select {
    font: inherit; color: var(--text); background: #2a2f38; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 16px; cursor: pointer;
  }
  button:hover { background: #343a45; }
  button:disabled { opacity: .45; cursor: default; }
  #rec { background: var(--accent); border-color: var(--accent); font-weight: 700; padding: 12px 26px; }
  #rec.stop { background: #2a2f38; border-color: var(--accent); color: var(--accent); }
  label.chk { color: var(--muted); font-size: 14px; display: flex; gap: 6px; align-items: center; }
  @media (max-width: 820px) { main { padding: 6px; gap: 8px; } .panel { padding: 10px; border-radius: 12px; } .topic { font-size: 26px !important; } h1 { margin-bottom: 8px; } }
  .topic { font-size: 40px; font-weight: 700; line-height: 1.15; margin: 4px 0 18px; width: 100%; text-align: left;
           background: none; border: 0; padding: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .topic:hover { background: none; }
  .chev { font-size: 22px; color: var(--muted); transition: transform .15s; }
  .collapsed .chev { transform: rotate(-90deg); }
  .collapsed .topic { margin-bottom: 0; }
  .collapsed #details { display: none; }
  .steps { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .steps li { background: #23272e; border-radius: 8px; padding: 10px 12px; }
  .steps b { display: block; }
  .steps span { color: var(--muted); font-size: 14px; }
  .status { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 1.4em; word-break: break-word; }
  .status.ok { color: var(--ok); } .status.err { color: var(--accent); }
  .folder { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .folder b { color: var(--text); }
  #last { width: 100%; max-width: 420px; margin: 0 auto 12px; border-radius: 8px; display: none; }
  .count { font-size: 14px; color: var(--muted); margin-left: auto; }
  a.dl { color: var(--ok); }
</style>
</head>
<body>
<main>
  <section class="panel">
    <div class="stage">
      <video id="preview" autoplay muted playsinline></video>
      <div id="countdown"></div>
      <div id="caption"></div>
      <div class="timer" id="timer">0:00 / 1:00</div>
      <div id="tag"></div>
      <div class="bar"><div id="progress"></div></div>
    </div>
    <div class="recrow">
      <button id="rec">● Rec</button>
      <label class="chk"><input type="checkbox" id="prep"> 10 s</label>
      <span class="status" id="status">Startar kameran…</span>
      <span class="count" id="count"></span>
    </div>
  </section>

  <section class="panel">
    <h1>Ämne</h1>
    <button class="topic" id="topicBtn" aria-expanded="true"><span id="topic">…</span><span class="chev" aria-hidden="true">▾</span></button>
    <div id="details">
    <div class="controls" style="margin-top:0">
      <button id="next">Nytt ämne</button>
      <select id="framework" aria-label="Modell"></select>
    </div>
    <ul class="steps" id="steps"></ul>
    </div>
  </section>
  <section class="panel wide">
    <h1>Spara</h1>
    <div class="status" id="save" style="margin-top:0">Inget klipp att spara än.</div>
    <div class="folder" id="folderRow">
      Sparas i: <b id="folderName">ingen mapp vald</b>
      <button id="pick" style="margin-left:8px;padding:6px 12px">Välj mapp</button>
    </div>
  </section>
  <section class="panel wide">
    <h1>Klipp</h1>
    <video id="last" controls playsinline></video>
    <ul id="clips"></ul>
  </section>
</main>

<script>
const LIMIT = 60;
const MOBILE = matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 820;
document.body.classList.toggle("mobile", MOBILE);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

const TOPICS = ["Kollektivtrafik","Kaffe","Måndagar","Att flytta hemifrån","Möten","Sömn","Semester","Matlådor",
"Mobiltelefoner","Att läsa böcker","Träning","Grannar","Väder","Att laga mat","Pengar","Barndomens somrar",
"Distansarbete","Cykling","Att lära sig ett språk","Husdjur","Musik","Städning","Att ge feedback","Tålamod",
"Sociala medier","Att säga nej","Vinter","Frukost","Bilkörning","Att resa ensam","Vänskap","Deadlines",
"Trädgård","Podcasts","Att vara nybörjare","Köer","Presenter","E-post","Morgonrutiner","Nyheter","Att be om hjälp",
"Film","Kontorslandskap","Promenader","Att misslyckas","Streamingtjänster","Bibliotek","Snabbmat","Att vänta",
"Hantverk","Jobbintervjuer","Tystnad","Att fira födelsedag","Återvinning","Fotboll","Kalendern","Att packa en väska",
"Småprat","AI","Att hålla tal","Second hand","Fika","Stress","Lördagsgodis","Att byta jobb","Skogen",
"Vanor","Hemmakontor","Tandläkaren","Att ha fel","Brädspel","Midsommar","Löpning","Att lyssna"];

const FRAMEWORKS = {
  "1-2-3": [["En sak","Det viktigaste du vill att lyssnaren ska veta"],["Två typer","Dela upp ämnet i två slag"],["Tre steg","Hur man gör, i tre steg"]],
  "PARA": [["Point","Din poäng"],["Action","Vad du gjorde"],["Result","Vad det ledde till"],["Ask","En fråga till lyssnaren"]],
  "PREP": [["Point","Din poäng"],["Reason","Varför"],["Example","Ett konkret exempel"],["Point","Poängen igen"]]
};

const $ = id => document.getElementById(id);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let stream, recorder, chunks = [], state = "idle", tick, t0, dirHandle, currentTopic, recog, finalText = "";
const urls = {};

function setStatus(msg, cls = "") { const s = $("status"); s.className = "status " + cls; s.innerHTML = msg; }
function setSave(msg, cls = "") { const s = $("save"); s.className = "status " + cls; s.innerHTML = msg; }
function fmt(s) { return Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }

function newTopic() {
  let t; do { t = TOPICS[Math.floor(Math.random() * TOPICS.length)]; } while (t === currentTopic);
  currentTopic = t; $("topic").textContent = t; $("tag").textContent = t;
}
function renderSteps() {
  const f = $("framework").value; store.set("fw", f);
  $("steps").innerHTML = FRAMEWORKS[f].map(([a, b]) => `<li><b>${a}</b><span>${b}</span></li>`).join("");
}
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function showCount() {
  const c = store.get("counts", {}); const total = Object.values(c).reduce((a, b) => a + b, 0);
  $("count").textContent = `${c[today()] || 0} idag · ${total} tot`;
}
function bump() { const c = store.get("counts", {}); c[today()] = (c[today()] || 0) + 1; store.set("counts", c); showCount(); }

// ---- Kamera ----
async function initCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: MOBILE ? { facingMode: "user", width: { ideal: 480 }, height: { ideal: 600 }, aspectRatio: { ideal: 0.8 }, frameRate: { ideal: 24 } }
                    : { facingMode: "user", width: { ideal: 640 }, height: { ideal: 360 }, aspectRatio: { ideal: 16 / 9 }, frameRate: { ideal: 24 } }, audio: true });
    $("preview").srcObject = stream;
    setStatus("Redo.");
  } catch (e) {
    $("rec").disabled = true;
    setStatus("Kameran eller mikrofonen kunde inte startas (" + e.name + "). Tillåt åtkomst i webbläsaren och ladda om.", "err");
  }
}
function pickMime() {
  const c = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  return c.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}

// ---- Inspelning ----
function startPrep() {
  const secs = $("prep").checked ? 10 : 5;
  state = "prep"; t0 = Date.now();
  $("rec").textContent = "Avbryt"; $("rec").classList.add("stop");
  $("countdown").style.display = "flex"; $("caption").textContent = "";
  setStatus("Gör dig redo.");
  const show = () => {
    const left = secs - (Date.now() - t0) / 1000;
    $("countdown").textContent = Math.max(1, Math.ceil(left));
    if (left <= 0) { clearInterval(tick); $("countdown").style.display = "none"; startRec(); }
  };
  show(); tick = setInterval(show, 100);
}
// ---- Undertexter (webbläsarens taligenkänning) ----
function setCaption(t) { const c = $("caption"); c.textContent = ""; if (t) { const sp = document.createElement("span"); sp.textContent = t; c.appendChild(sp); } }
function startCaptions() {
  finalText = "";
  return; // Taligenkänningen gav ingen text på iPhone; avstängd.
  try {
    recog = new SR(); recog.lang = "sv-SE"; recog.continuous = true; recog.interimResults = true;
    let base = "";
    recog.onresult = e => {
      let fin = "", interim = "";
      for (const r of e.results) (r.isFinal ? (fin += r[0].transcript + " ") : (interim += r[0].transcript));
      finalText = (base + fin).trim();
    };
    recog.onend = () => { if (state === "rec") { base = finalText + " "; try { recog.start(); } catch {} } };
    recog.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { recog.onend = null; } };
    recog.start();
  } catch { recog = null; }
}
function stopCaptions() { if (recog) { recog.onend = null; try { recog.stop(); } catch {} recog = null; } }
let canvas, ctx, raf, recTopic;
function burnStream() {
  const v = $("preview");
  if (!v.videoWidth || !HTMLCanvasElement.prototype.captureStream) return null;
  const A = MOBILE ? 4 / 5 : 16 / 9;                       // samma beskärning som förhandsvisningen
  let w = Math.min(v.videoWidth, v.videoHeight * A), h = w / A;
  w = Math.round(w / 2) * 2; h = Math.round(h / 2) * 2;
  const sx = (v.videoWidth - w) / 2, sy = (v.videoHeight - h) / 2;
  canvas = canvas || document.createElement("canvas"); canvas.width = w; canvas.height = h;
  ctx = canvas.getContext("2d");
  const fs = Math.round(h * 0.04), pad = Math.round(fs * 0.45), m = Math.round(h * 0.03);
  const draw = () => {
    ctx.drawImage(v, sx, sy, w, h, 0, 0, w, h);
    ctx.font = `700 ${fs}px -apple-system, "Helvetica Neue", sans-serif`;
    let t = recTopic; while (ctx.measureText(t).width > w * 0.6 && t.length > 4) t = t.slice(0, -2) + "…";
    const tw = ctx.measureText(t).width, bw = tw + pad * 2, bh = fs + pad * 1.4, x = w - m - bw, y = h - m - bh;
    ctx.fillStyle = "rgba(0,0,0,.55)";
    if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, bw, bh, pad * 0.7); ctx.fill(); } else ctx.fillRect(x, y, bw, bh);
    ctx.fillStyle = "#fff"; ctx.textBaseline = "middle"; ctx.fillText(t, x + pad, y + bh / 2 + 1);
    raf = requestAnimationFrame(draw);
  };
  draw();
  return new MediaStream([...canvas.captureStream(24).getVideoTracks(), ...stream.getAudioTracks()]);
}
function startRec() {
  const mime = pickMime();
  recTopic = currentTopic;
  const src = burnStream() || stream;
  try {
    recorder = new MediaRecorder(src, { mimeType: mime || undefined, videoBitsPerSecond: 400000, audioBitsPerSecond: 48000 });
  } catch (e) { cancelAnimationFrame(raf); reset(); setStatus("Inspelningen kunde inte startas: " + e.message, "err"); return; }
  chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => { cancelAnimationFrame(raf); if (src !== stream) src.getVideoTracks().forEach(t => t.stop()); finish(); };
  recorder.start(1000);
  state = "rec"; t0 = Date.now();
  $("rec").textContent = "■ Stopp"; $("rec").classList.add("stop");
  $("timer").className = "timer rec";
  setStatus("Spelar in.");
  startCaptions();
  tick = setInterval(() => {
    const s = (Date.now() - t0) / 1000;
    $("timer").innerHTML = '<span class="dot"></span>' + fmt(s) + " / " + fmt(LIMIT);
    $("progress").style.width = Math.min(100, s / LIMIT * 100) + "%";
    if (s >= LIMIT) stopRec();
  }, 100);
}
function stopRec() { clearInterval(tick); stopCaptions(); if (recorder && recorder.state !== "inactive") recorder.stop(); }
function reset() {
  clearInterval(tick); state = "idle"; stopCaptions(); $("countdown").style.display = "none";
  $("rec").textContent = "● Rec"; $("rec").classList.remove("stop");
  $("timer").className = "timer"; $("timer").textContent = "0:00 / " + fmt(LIMIT);
  $("progress").style.width = "0";
}
function slug(s) {
  return s.toLowerCase().replace(/[åä]/g, "a").replace(/ö/g, "o").replace(/é/g, "e").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}
async function finish() {
  const type = recorder.mimeType || "video/webm";
  const blob = new Blob(chunks, { type });
  const ext = type.includes("mp4") ? "mp4" : "webm";
  const d = new Date();
  const name = `${today()}_${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}${String(d.getSeconds()).padStart(2,"0")}_${slug($("framework").value)}_${slug(recTopic)}.${ext}`;
  const mb = (blob.size / 1048576).toFixed(1);
  const dur = Math.min(LIMIT, (Date.now() - t0) / 1000);
  let thumb = "";
  try { const v = $("preview"), c = document.createElement("canvas"); c.width = 88; c.height = 110;
    const sc = Math.max(88 / v.videoWidth, 110 / v.videoHeight), w = v.videoWidth * sc, h = v.videoHeight * sc;
    c.getContext("2d").drawImage(v, (88 - w) / 2, (110 - h) / 2, w, h); thumb = c.toDataURL("image/jpeg", 0.5); } catch {}
  const text = finalText;
  reset();
  setTimeout(() => setCaption(""), 1500);

  const lastUrl = urls[name] = URL.createObjectURL(blob);
  const clips = store.get("clips", []);
  clips.unshift({ name, topic: recTopic, fw: $("framework").value, ts: d.getTime(), dur, mb, thumb, text });
  store.set("clips", clips.slice(0, 60)); renderClips();

  let saved = false;
  if (dirHandle) {
    try {
      const fh = await dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      saved = true;
      setSave(`Sparad: ${name} (${mb} MB)`, "ok");
    } catch (e) { setSave("Kunde inte spara i mappen (" + e.name + "). ", "err"); }
  }
  if (!saved) {
    const s = $("save"); if (!dirHandle) setSave("Ingen mapp vald. ", "");
    const a = document.createElement("a"); a.href = lastUrl; a.download = name; a.className = "dl";
    a.textContent = `Ladda ner ${name} (${mb} MB)`;
    const file = new File([blob], name, { type: type.split(";")[0] });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      setSave(`Klart: ${name} (${mb} MB). `, "ok");
      const b = document.createElement("button"); b.textContent = "Spara i Filer / dela"; b.style.marginLeft = "4px";
      b.onclick = async () => { try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== "AbortError") { s.appendChild(document.createTextNode(" ")); s.appendChild(a); } } };
      s.appendChild(b);
    } else s.appendChild(a);
  }
  setStatus("Redo.");
  bump(); newTopic();
}

// ---- Lista över klipp ----
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function renderClips() {
  const clips = store.get("clips", []);
  if (!clips.length) { $("clips").innerHTML = '<li class="empty">Inga klipp än.</li>'; return; }
  $("clips").innerHTML = clips.map((c, i) => {
    const when = new Date(c.ts).toLocaleString("sv-SE", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<li>${c.thumb ? `<img src="${c.thumb}" alt="">` : ""}<div><div class="t">${esc(c.topic)}</div>
      <div class="m">${esc(c.fw)} · ${when} · ${fmt(c.dur)} · ${esc(c.mb)} MB</div>
      ${c.text ? `<details><summary>Text</summary>${esc(c.text)}</details>` : ""}</div>
      ${urls[c.name] ? `<button data-i="${i}">Spela</button>` : ""}</li>`;
  }).join("");
}
$("clips").onclick = e => { const b = e.target.closest("button[data-i]"); if (!b) return;
  const c = store.get("clips", [])[b.dataset.i], last = $("last"); if (!c || !urls[c.name]) return;
  last.src = urls[c.name]; last.style.display = "block"; last.play().catch(() => {}); };

// ---- Mapp (sparas mellan besök i IndexedDB) ----
function idb() { return new Promise((res, rej) => { const r = indexedDB.open("ovningsstudio", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v) { try { const db = await idb(); db.transaction("kv", "readwrite").objectStore("kv").put(v, k); } catch {} }
async function idbGet(k) { try { const db = await idb(); return await new Promise(res => { const r = db.transaction("kv").objectStore("kv").get(k);
  r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); } catch { return null; } }

async function pickFolder() {
  if (!window.showDirectoryPicker) { setSave("Den här webbläsaren kan inte spara direkt i en mapp. Använd Chrome, annars laddas klippen ner.", "err"); return; }
  try {
    // Finns en sparad mapp som bara saknar behörighet: fråga om den först.
    const stored = await idbGet("dir");
    if (stored && !dirHandle && await stored.requestPermission({ mode: "readwrite" }) === "granted") { useFolder(stored); return; }
    const h = await window.showDirectoryPicker({ mode: "readwrite" });
    await idbSet("dir", h); useFolder(h);
  } catch (e) { if (e.name !== "AbortError") setSave("Mappen kunde inte väljas: " + e.name, "err"); }
}
function useFolder(h) { dirHandle = h; $("folderName").textContent = h.name; $("pick").textContent = "Byt mapp"; }
async function restoreFolder() {
  const h = await idbGet("dir"); if (!h) return;
  try {
    if (await h.queryPermission({ mode: "readwrite" }) === "granted") useFolder(h);
    else { $("folderName").textContent = h.name + " (behöver godkännas igen)"; $("pick").textContent = "Godkänn mapp"; }
  } catch {}
}

// ---- Start ----
$("framework").innerHTML = Object.keys(FRAMEWORKS).map(k => `<option>${k}</option>`).join("");
$("framework").value = FRAMEWORKS[store.get("fw", "1-2-3")] ? store.get("fw", "1-2-3") : "1-2-3";
$("framework").onchange = renderSteps;
$("next").onclick = newTopic;
$("prep").checked = store.get("prep10", false);
$("prep").onchange = () => store.set("prep10", $("prep").checked);
const topicPanel = $("topicBtn").closest(".panel");
function setCollapsed(c) { topicPanel.classList.toggle("collapsed", c); $("topicBtn").setAttribute("aria-expanded", String(!c)); store.set("collapsed", c); }
$("topicBtn").onclick = () => setCollapsed(!topicPanel.classList.contains("collapsed"));
setCollapsed(store.get("collapsed", false));
$("pick").onclick = pickFolder;
$("rec").onclick = () => {
  if (state === "idle") startPrep();
  else if (state === "prep") { reset(); setStatus("Avbrutet."); }
  else stopRec();
};
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName !== "SELECT" && e.target.tagName !== "BUTTON") { e.preventDefault(); $("rec").click(); } });
if (!window.showDirectoryPicker) $("folderRow").innerHTML = "Efter varje klipp: tryck <b>Spara i Filer / dela</b> och välj din iCloud-mapp.";
renderSteps(); newTopic(); showCount(); renderClips(); restoreFolder(); initCamera();
</script>
</body>
